[workspace]
channels = ["conda-forge"]
name = "LiveCaption"
platforms = ["win-64", "linux-64"]
version = "0.1.0"
license = "BSD-3-Clause"
license-file = "LICENSE"

[tasks]
caption = "python run.py"
# The default shape for a meeting. It shows captions in the browser, and you
# enter the Zoom token later, from the page.
web = "python run.py --web"
devices = "python run.py --list-devices"

[dependencies]
python = "3.12.*"
websockets = ">=17.1,<18"
numpy = ">=2.5.2,<3"
python-sounddevice = ">=0.5.6,<0.6"
segno = ">=1.6.6,<2"
pystray = ">=0.19.5,<0.20"
pillow = ">=12.3.0,<13"
