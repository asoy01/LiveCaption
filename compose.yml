# LiveCaption を Docker で回す。
#
# **段階1。エンジンだけである。** 会議ソフトはまだ入っていない。
# 音は WAV で代用する。段階2で Tailscale のサイドカー、段階3で Zoom と
# PulseAudio が足される。
#
#   docker compose build
#   docker compose run --rm engine --from-file /samples/excerpt75.wav --dry-run
#
# **osmium で動かす前に ConnMan の除外一覧を直しておくこと。**
# 直っていないと、コンテナ起動から数十秒遅れてホストの外向き通信が死ぬ。
# 詳細は HANDOFF.md の「ConnMan が Docker の veth を掴む」。

name: livecaption

services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: livecaption-engine:dev
    # 会議で使う形。**`--device pulse` を渡すこと。** 既定の "CABLE Output" は
    # Windows の仮想ケーブルの名前で、コンテナには無い。
    # **閲覧画面は 0.0.0.0 で待ち受ける。** コンテナの中の話なので、外に出るのは
    # 下の `ports` が通す分（ホストの 127.0.0.1）と、配信を始めたとき（Funnel）
    # だけである。操作画面はこの設定の影響を受けない。
    command:
      - "--web"
      - "--no-browser"
      - "--control-bind"
      - "--web-bind"
      - "0.0.0.0"
      - "--device"
      - "pulse"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Tokyo
      # tailnet 上の名前。**変えると配ってあった閲覧URLが死ぬ。**
      # **用語対訳表は state ボリュームの中に置く。** 操作画面から足したり
      # 消したりする利用者データなので、イメージに焼き込むと作り直しで消える。
      LIVECAPTION_GLOSSARY_DIR: /app/local/glossary
      TS_HOSTNAME: livecaption
      # **上の `restart` と対にすること。** 操作画面の「終了」の見え方が変わる。
      # 勝手に戻ってくるのに「終了」と書いてあると、押した人は壊れたと思う。
      LIVECAPTION_RESTARTS: "1"
      # TS_AUTHKEY は .env から入る（署名済みの鍵）。
      # 中の画面を人が触りたいとき（Zoomへのサインインなど）に 1 にする。
      # **認証が無いので、常用しないこと。**
      LIVECAPTION_VNC: "${LIVECAPTION_VNC:-0}"
    # **userspace-networking では足りない。** 操作画面を tailnet に出すには、
    # 100.x のアドレスが実際のインターフェースに載っている必要がある。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # **`local/` はまるごとボリュームに載せる。** ここが消えると、
      # 会議IDが変わって閲覧URLが毎回別物になり、Zoom字幕の `seq` も巻き戻る。
      # 中身は meetings.json・seq_state.json・direction_state.json・
      # glossary_state.json・ui_lang_state.json・tunnel_kind.json・transcripts/。
      #
      # **Dropbox の中には書かない。** 会議の記録が全部クラウドに上がることになる。
      - state:/app/local
      # **Tailscale の状態。消すと署名からやり直しになる。**
      # ホスト名も変わるので、配ってあった閲覧URLが死ぬ。
      - tailscale:/var/lib/tailscale
      # **Zoom の設定とサインイン。** 消すとサインインのやり直しになる。
      - zoomhome:/home/livecaption
      # 試験用の音。`--from-file` で使う。
      - ./local/SampleRecordings/_wav24k:/samples:ro
    ports:
      # **閲覧画面だけを出す。** 操作画面(8081)はコンテナの中の 127.0.0.1 に
      # 留まるので、ここからは届かない。操作画面には認証が無いためで、
      # tailnet から開けるようにするのは段階2（Tailscale のサイドカー）である。
      - "127.0.0.1:8080:8080"
    # **必ず入れること。** これが無いと、次の2つが起きる。
    #
    #   osmium を再起動すると、字幕システムが上がってこない。常時起動の機体で
    #   予定の会議に備える前提が崩れる。
    #
    #   操作画面の「終了」を押すと、コンテナが止まったきりになる。操作画面も
    #   消えるので、**osmium に ssh しないと戻せない。**「外から WebUI だけで
    #   使う」という前提が、そこで途切れる。
    #
    # `unless-stopped` なので、`docker compose stop` で止めたものは上がってこない。
    # **「終了」は「再起動」になる**（下の LIVECAPTION_RESTARTS と対にすること）。
    restart: unless-stopped
    init: true
    stop_grace_period: 15s

volumes:
  state:
  tailscale:
  zoomhome:
