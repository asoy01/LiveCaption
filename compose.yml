# Run LiveCaption with Docker.
#
# **Everything is in this one box.** The caption engine, Zoom, PulseAudio,
# Tailscale and VNC. The host needs only Docker. It uses no audio device
# and no display.
#
#   cp .env.example .env    # put OPENAI_API_KEY in it
#   docker compose up -d --build
#   docker compose logs -f  # the control page URL appears here
#
# The steps are in docs/manual.md, section "2. Install (Windows + Docker)".
# Appendix A covers what differs on Linux.
#
# **On a host that runs ConnMan, fix the exclusion list first.**
# If you do not, the host loses its outgoing network a few tens of seconds
# after the container starts. See "A.2 If the machine runs ConnMan" in the
# manual.

name: livecaption

services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: livecaption-engine:dev
    # The shape used in meetings. **Pass `--device pulse`.** The default
    # "CABLE Output" is the name of the virtual cable on Windows, and the
    # container does not have it.
    # **The viewer page listens on 0.0.0.0.** That is inside the container, so
    # the only ways out are what `ports` below opens (127.0.0.1 on the host)
    # and Funnel, once delivery starts. The control page is not affected by
    # this setting.
    command:
      - "--web"
      - "--no-browser"
      - "--control-bind"
      - "--web-bind"
      - "0.0.0.0"
      - "--device"
      - "pulse"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Tokyo
      # **Keep the glossary inside the state volume.** It is user data that
      # people add and delete from the control page, so baking it into the
      # image means it is lost every time the container is rebuilt.
      LIVECAPTION_GLOSSARY_DIR: /app/local/glossary
      # The name on the tailnet. **Change it on every machine.** If two
      # machines on the same tailnet claim the same name, the later one is
      # renamed to `livecaption-1`.
      # **The host name in the viewer URL changes, so URLs you handed out
      # beforehand stop working.**
      # This value comes from `.env`. **Do not write it here directly again.**
      # `environment:` wins over `env_file:`, so a direct value makes the one
      # in `.env` be ignored silently.
      TS_HOSTNAME: "${TS_HOSTNAME:-livecaption}"
      # **This is the same variable as `restart` below. It is built so that
      # you never have to keep two of them in step.**
      # If "Quit" on the control page brings the system back, the button has
      # to say "Restart". If it says "Quit" and the system comes back by
      # itself, the person who pressed it thinks it is broken.
      # With two variables, a day comes when someone fixes only one of them
      # and the wording no longer matches what happens.
      LIVECAPTION_RESTART: "${LIVECAPTION_RESTART:-unless-stopped}"
      # TS_AUTHKEY comes from .env (a signed key).
      # Set this to 1 when you want VNC up as soon as the container starts.
      # Use it when a person has to work on the screen inside the container,
      # for example to sign in to Zoom.
      # **There is no authentication, so do not leave it on.** It is better to
      # start it from "Settings" on the control page only when you need it.
      LIVECAPTION_VNC: "${LIVECAPTION_VNC:-0}"
    # **userspace-networking is not enough.** To put the control page on the
    # tailnet, the 100.x address has to sit on a real interface.
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # **Put all of `local/` on a volume.** If it is lost, the meeting IDs
      # change, every viewer URL becomes a different one, and the `seq` for
      # the Zoom captions rolls back.
      # It holds meetings.json, seq_state.json, direction_state.json,
      # glossary_state.json, ui_lang_state.json, tunnel_kind.json and
      # transcripts/.
      #
      # **Do not put it inside Dropbox.** Every meeting record would then go
      # up to the cloud.
      - state:/app/local
      # **Tailscale state. Delete it and you start again from the signing.**
      # The host name changes too, so the viewer URLs you handed out die.
      - tailscale:/var/lib/tailscale
      # **Zoom settings and sign-in.** Delete it and you have to sign in again.
      - zoomhome:/home/livecaption
      #
      # **When you test with a recording, do not add a volume here.** It is a
      # one-time thing, so pass it on the command line instead. If you name a
      # path here that a fresh clone does not have, Docker creates an empty
      # folder owned by root.
      #
      #   docker compose run --rm -v "$PWD/recordings:/samples:ro" engine \
      #     --from-file /samples/test.wav --dry-run
    ports:
      # **Only the viewer page is exposed.** It is there so you can open it in
      # the host's browser when you show the captions by screen sharing.
      # **The control page (8081) is not exposed.** It has no authentication,
      # so it stays inside the tailnet (the container itself is a tailnet
      # node).
      - "127.0.0.1:8080:8080"
    # **On a machine that stays powered on, leave this as `unless-stopped`**
    # (the default). Removing it causes two problems.
    #
    #   After the host reboots, the caption system does not come back. That
    #   breaks the assumption that a machine which stays on is ready for a
    #   scheduled meeting.
    #
    #   Pressing "Quit" on the control page leaves the container stopped. The
    #   control page is gone too, so **you have to ssh into the host to bring
    #   it back.** The idea of running everything from the control page, from
    #   somewhere else, ends there.
    #
    # It is `unless-stopped`, so what you stop with `docker compose stop`
    # stays stopped. You can still stop it on purpose.
    #
    # **On a laptop that you start only for a meeting, put
    # `LIVECAPTION_RESTART=no` in `.env`.** Otherwise the caption system
    # starts every time you start Docker Desktop, and it even joins Zoom if a
    # meeting is scheduled. **This is the same variable as the environment
    # variable above, so you cannot change only one of them.**
    restart: "${LIVECAPTION_RESTART:-unless-stopped}"
    init: true
    stop_grace_period: 15s

volumes:
  state:
  tailscale:
  zoomhome:
