# LiveCaption を Docker で回す。
#
# **この1つの箱に全部入っている。** 字幕のエンジン・Zoom・PulseAudio・
# Tailscale・VNC である。ホストに要るのは Docker だけで、音声装置も
# 画面も使わない。
#
#   cp .env.example .env    # OPENAI_API_KEY を入れる
#   docker compose up -d --build
#   docker compose logs -f  # 操作画面のURLが出る
#
# 手順は docs/manual.ja.md の「2. インストール（Docker）」にある。
#
# **ConnMan を使っているホストでは、除外一覧を先に直しておくこと。**
# 直っていないと、コンテナ起動から数十秒遅れてホストの外向き通信が死ぬ。
# マニュアルの「2.6 ConnMan の除外設定」を見ること。

name: livecaption

services:
  engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: livecaption-engine:dev
    # 会議で使う形。**`--device pulse` を渡すこと。** 既定の "CABLE Output" は
    # Windows の仮想ケーブルの名前で、コンテナには無い。
    # **閲覧画面は 0.0.0.0 で待ち受ける。** コンテナの中の話なので、外に出るのは
    # 下の `ports` が通す分（ホストの 127.0.0.1）と、配信を始めたとき（Funnel）
    # だけである。操作画面はこの設定の影響を受けない。
    command:
      - "--web"
      - "--no-browser"
      - "--control-bind"
      - "--web-bind"
      - "0.0.0.0"
      - "--device"
      - "pulse"
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Asia/Tokyo
      # tailnet 上の名前。**変えると配ってあった閲覧URLが死ぬ。**
      # **用語対訳表は state ボリュームの中に置く。** 操作画面から足したり
      # 消したりする利用者データなので、イメージに焼き込むと作り直しで消える。
      LIVECAPTION_GLOSSARY_DIR: /app/local/glossary
      # tailnet 上の名前。**機体ごとに変えること。** 同じ tailnet で2台が
      # 同じ名前を名乗ると、あとから来たほうが `livecaption-1` にされる。
      # **閲覧URLのホスト名が変わるので、前もって配ってあったURLが死ぬ。**
      # ここは `.env` から取る。**直書きに戻さないこと。** `environment:` は
      # `env_file:` より強いので、直書きすると `.env` の値が黙って無視される。
      TS_HOSTNAME: "${TS_HOSTNAME:-livecaption}"
      # **下の `restart` と同じ変数である。対にする必要がない形にしてある。**
      # 操作画面の「終了」は、戻ってくるなら「再起動」と書かなければならない。
      # 勝手に戻ってくるのに「終了」と書いてあると、押した人は壊れたと思う。
      # 2つの変数に分けると、片方だけ直して文言が実際と食い違う日が来る。
      LIVECAPTION_RESTART: "${LIVECAPTION_RESTART:-unless-stopped}"
      # TS_AUTHKEY は .env から入る（署名済みの鍵）。
      # 起動と同時に VNC を上げたいときに 1 にする。Zoom へのサインインなど、
      # コンテナの中の画面を人が操作する必要があるときに使う。
      # **認証が無いので、常用しないこと。** 操作画面の「設定」から、
      # 必要なときだけ起動するほうがよい。
      LIVECAPTION_VNC: "${LIVECAPTION_VNC:-0}"
    # **userspace-networking では足りない。** 操作画面を tailnet に出すには、
    # 100.x のアドレスが実際のインターフェースに載っている必要がある。
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      # **`local/` はまるごとボリュームに載せる。** ここが消えると、
      # 会議IDが変わって閲覧URLが毎回別物になり、Zoom字幕の `seq` も巻き戻る。
      # 中身は meetings.json・seq_state.json・direction_state.json・
      # glossary_state.json・ui_lang_state.json・tunnel_kind.json・transcripts/。
      #
      # **Dropbox の中には書かない。** 会議の記録が全部クラウドに上がることになる。
      - state:/app/local
      # **Tailscale の状態。消すと署名からやり直しになる。**
      # ホスト名も変わるので、配ってあった閲覧URLが死ぬ。
      - tailscale:/var/lib/tailscale
      # **Zoom の設定とサインイン。** 消すとサインインのやり直しになる。
      - zoomhome:/home/livecaption
      #
      # **録音した音で試すときは、ここにボリュームを足さない。** 一度きりの
      # 話なので、その場で渡すほうがよい。fresh clone に無い場所をここに書くと、
      # Docker が root 持ちの空フォルダを勝手に作る。
      #
      #   docker compose run --rm -v "$PWD/録音:/samples:ro" engine \
      #     --from-file /samples/test.wav --dry-run
    ports:
      # **閲覧画面だけを出す。** 画面共有で見せるときに、ホストのブラウザから
      # 開くためにある。**操作画面(8081)は出さない。** 認証が無いので、
      # tailnet の中だけに置く（コンテナ自身が tailnet のノードになっている）。
      - "127.0.0.1:8080:8080"
    # **常時起動の機体では `unless-stopped` のままにすること**（既定）。
    # 外すと2つ起きる。
    #
    #   ホストを再起動すると、字幕システムが上がってこない。常時起動の機体で
    #   予定の会議に備える前提が崩れる。
    #
    #   操作画面の「終了」を押すと、コンテナが止まったきりになる。操作画面も
    #   消えるので、**ホストに ssh しないと戻せない。**「外から操作画面だけで
    #   使う」という前提が、そこで途切れる。
    #
    # `unless-stopped` なので、`docker compose stop` で止めたものは上がってこない。
    # 意図して止める道は残る。
    #
    # **会議のときだけ起こすノートPCでは `.env` に `LIVECAPTION_RESTART=no`。**
    # そうしないと、Docker Desktop を立ち上げるたびに字幕システムが勝手に上がり、
    # 予定を入れてあれば Zoom にまで入る。**上の環境変数と同じ変数なので、
    # 片方だけ直すことはできない。**
    restart: "${LIVECAPTION_RESTART:-unless-stopped}"
    init: true
    stop_grace_period: 15s

volumes:
  state:
  tailscale:
  zoomhome:
